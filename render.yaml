services:
- type: web
  name: nanobot-telegram
  runtime: docker
  plan: free
  region: singapore
  dockerfilePath: ./Dockerfile
  dockerContext: .
  dockerCommand: /usr/local/bin/entrypoint.sh gateway
  autoDeploy: false
  healthCheckPath: /healthz
  envVars:
  - key: PORT
    value: '8765'
  - key: NANOBOT_RENDER_FREE
    value: '1'
  - key: NANOBOT_WEB_TOKEN
    generateValue: true
  - key: STATE_ENCRYPTION_KEY
    generateValue: true
  - key: STATE_NAMESPACE
    value: drillside-nanobot
  - key: UPSTASH_REDIS_REST_URL
    sync: false
  - key: UPSTASH_REDIS_REST_TOKEN
    sync: false
